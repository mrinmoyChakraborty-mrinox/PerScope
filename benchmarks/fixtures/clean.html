<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bench: clean dashboard</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; padding: 48px; height: calc(100% - 96px); }
  .card { border-radius: 16px; }
  .a { background: linear-gradient(135deg, #4f46e5, #818cf8); }
  .b { background: linear-gradient(135deg, #059669, #34d399); }
  .c { background: linear-gradient(135deg, #d97706, #fbbf24); }
  .d { background: linear-gradient(135deg, #dc2626, #f87171); }
  .e { background: linear-gradient(135deg, #7c3aed, #c4b5fd); }
  .f { background: linear-gradient(135deg, #0ea5e9, #7dd3fc); }
</style>
</head>
<body>
<div class="grid" aria-hidden="true">
  <div class="card a"></div><div class="card b"></div><div class="card c"></div>
  <div class="card d"></div><div class="card e"></div><div class="card f"></div>
</div>
</body>
</html>
