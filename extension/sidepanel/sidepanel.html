<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PerScope — Side Panel</title>
<link rel="icon" type="image/png" href="../assets/icon128.png">
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<div class="panel-shell" id="panelShell" data-theme="light">
  <header class="panel-header">
    <div class="brand">
      <div class="brand-icon">
        <img src="../assets/icon128.png" alt="PerScope logo" width="30" height="30" style="width:30px;height:30px;object-fit:contain;border-radius:9px;display:block;">
      </div>
      <h1>PerScope</h1>
    </div>
    <button class="icon-btn" id="btnTheme" title="Toggle light / dark">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="panel-main">
    <section class="card">
      <h2>On-device status</h2>
      <div class="status-row"><span>Compute</span><strong id="deviceLabel">Detecting…</strong></div>
      <div class="status-row"><span>Tier</span><strong id="deviceTier">—</strong></div>
      <div class="status-row"><span>Bridge</span><strong id="bridgeLabel">Checking…</strong></div>
      <div class="status-row"><span>Updated</span><strong id="updatedLabel">—</strong></div>
      <button class="btn btn-secondary btn-full" id="btnRefresh">Refresh status</button>
    </section>

    <section class="card">
      <h2>Privacy</h2>
      <p class="note">Captures are redacted on this device before anything is sent anywhere. Open the popup to capture, or review past captures in the dashboard.</p>
      <button class="btn btn-primary btn-full" id="btnOpenDashboard">Open dashboard</button>
    </section>
  </main>

  <footer class="panel-footer"><span>PerScope • 100% on-device</span></footer>
</div>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
